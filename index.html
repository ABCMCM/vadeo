<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Cuestionario de alta · Vadeo</title></head><body><title>Cuestionario Vadeo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: formulario guiado por pasos — índice de secciones a la izquierda, una sección cada vez a la derecha; en móvil, barra de progreso arriba */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --sunk:#e7eaee; --line:#d0d6de;
  --ink:#151b25; --muted:#5b6576; --accent:#24466f; --accent-ink:#ffffff; --accent-soft:#dde6f2; --good:#2e7a45; --good-soft:#dcefe2;
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--surface:#171d27;--sunk:#0c1016;--line:#2a3342;--ink:#e3e8ef;--muted:#93a0b3;--accent:#86a9de;--accent-ink:#0d1420;--accent-soft:#1f2d45;--good:#79c891;--good-soft:#18301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141b;--surface:#171d27;--sunk:#0c1016;--line:#2a3342;--ink:#e3e8ef;--muted:#93a0b3;--accent:#86a9de;--accent-ink:#0d1420;--accent-soft:#1f2d45;--good:#79c891;--good-soft:#18301f;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:240px 1fr;gap:28px;align-items:start}
.brand{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand .n{font-family:var(--f-display);font-weight:600;font-size:22px}
.brand .vplate{background:#FBF8F1;border:1px solid #E6DCC6;border-radius:12px;padding:8px 12px;flex:none}.brand .vplate svg{height:64px;width:auto;display:block}.brand{align-items:center}.brand .n{margin-right:auto}.brand .n small{display:block;font:500 11px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.saved{font-size:12.5px;color:var(--muted)}
.steps{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.steps button{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:var(--r);cursor:pointer;color:var(--muted)}
.steps button .k{font:500 12px var(--f-mono);width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}
.steps button.done .k{background:var(--good-soft);color:var(--good);border-color:transparent}
.steps button[aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.steps button[aria-current="step"] .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{display:none}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
#sec{display:flex;flex-direction:column;gap:18px;min-width:0}
h1{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.15;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.q{display:flex;flex-direction:column;gap:6px;min-width:0}
.q>span{font-weight:500}
.q small,.help{color:var(--muted);font-size:13px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale .opts button{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 4px;cursor:pointer;font:500 14px var(--f-mono)}
.scale .opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:10px}
.item{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.item .ih{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .ih b{font-family:var(--f-display);font-weight:600;font-size:17px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;padding:4px 0;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 15px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.code{font:12px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:180px;overflow:auto;overflow-wrap:anywhere;user-select:all}
.sum{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:14px}
.sum dt{color:var(--muted)} .sum dd{margin:0;overflow-wrap:anywhere}
.ok{padding:12px 14px;border-radius:var(--r);background:var(--good-soft);color:var(--ink);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);z-index:40;font-size:13px;max-width:calc(100% - 32px)}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr;gap:18px}
  .steps{display:none}
  .prog{display:flex;flex-direction:column;gap:6px}
  .prog .bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
  .prog .bar i{display:block;height:100%;background:var(--accent)}
  .prog span{font-size:12.5px;color:var(--muted)}
  .g2,.g3{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr}
}
.invbox{margin-top:12px;font-size:14px;color:var(--muted,#5b6475)}.invbox summary{cursor:pointer}.invrow{display:flex;gap:8px;flex-wrap:wrap}.invrow input{flex:1;min-width:200px;font:inherit;padding:9px 10px;border:1px solid var(--line,#ccc);border-radius:8px}.invhi{border-left:4px solid #C8962E}.invhi ul{margin:4px 0 0;padding-left:20px}.invhi .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A6A1F}</style>

function invWelcome(){const v=Q.inv;if(!v)return"";const L=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");

async function invDecode(c){c=String(c||"").trim().replace(/\s+/g,"");if(!/^INV1\.[zj]/.test(c))throw new Error("formato");const raw=atob(c.slice(6).replace(/-/g,"+").replace(/_/g,"/"));const by=Uint8Array.from(raw,x=>x.charCodeAt(0));
  let txt;if(c[5]==="z"){const ds=new DecompressionStream("deflate-raw");txt=await new Response(new Blob([by]).stream().pipeThrough(ds)).text()}else txt=new TextDecoder().decode(by);return JSON.parse(txt)}
function invApply(v){if(!v||!v.id)throw new Error("vacío");Q.inv=v;Q.empresa=Q.empresa||{};const E=Q.empresa;if(!E.nombre&&v.empresa)E.nombre=v.empresa;if(!E.sector&&v.sector)E.sector=v.sector;if(!E.web&&v.web)E.web=v.web;if(!E.mercados&&v.pais)E.mercados=v.pais;
  const prev=Q.caso||[];Q.caso=(v.preguntas||[]).map(q=>({q,a:(prev.find(x=>x.q===q)||{}).a||""}));save();invSync()}

    clientes:Q.clientes.filter(c=>c.company).map(c=>({...c,segment:c.segment!==""&&c.segment!=null?Q.segmentos[+c.segment]?.name||null:null})),
    canales:Q.canales.filter(c=>c.name),economia:Q.economia,ellis:Q.ellis,pruebas:Q.pruebas.filter(p=>p.title),antirriesgo:Q.antirriesgo,producto:Q.producto,
    expansion:{...Q.expansion,socios:(Q.expansion.socios||[]).map(i=>["Distribuidor o importador","Cadena de distribución o retail","Socio industrial o fabricante local","Socio comercial o agente","Inversor financiero","Empresa para una adquisición o fusión"][i])}}}
function encode(o){const b=new TextEncoder().encode(JSON.stringify(o));let s="";b.forEach(x=>s+=String.fromCharCode(x));return"ABC1."+btoa(s)}
function completeness(){const c=[["Su empresa",!!Q.empresa.nombre&&!!Q.contacto.email],["Cliente y problema",["forWho","pain","solution","alternative","diff"].filter(k=>Q.vp[k]).length>=4],["Segmentos",Q.segmentos.some(g=>g.name&&g.urgency)],["Ventas en curso",Q.clientes.some(c=>c.company)],["Canales",Q.canales.some(c=>c.name)],["Números clave",!!Q.economia.ticket],["Confianza",Q.pruebas.length>0||Q.antirriesgo.length>0],["Expansión",!!Q.expansion.mercados]];return c}
function review(){const p=payload(),c=completeness();const missing=c.filter(x=>!x[1]).map(x=>x[0]);
  return `<h1>Revisar y enviar</h1><p class="lede">Compruebe el resumen. Si todo está bien, copie el código de respuestas y envíelo por correo a su asesor de ABC.</p>
  ${missing.length?`<div class="card"><b>Secciones incompletas</b><p class="help" style="margin:0">${missing.join(" · ")}. Puede enviarlo igualmente; las completaremos en la primera reunión.</p></div>`:`<div class="ok">Ha completado todas las secciones. Gracias.</div>`}
  <div class="card"><dl class="sum"><dt>Empresa</dt><dd>${esc(p.empresa.nombre||"—")} · ${esc(p.empresa.sector||"")}</dd><dt>Contacto</dt><dd>${esc([p.contacto.nombre,p.contacto.cargo,p.contacto.email].filter(Boolean).join(" · ")||"—")}</dd>
  <dt>Cliente ideal</dt><dd>${esc(p.vp.forWho||"—")}</dd><dt>Tipos de cliente</dt><dd>${p.segmentos.length} · prioritario: ${esc(p.nicho||"—")}</dd><dt>Comentarios de clientes</dt><dd>${p.voz.length}</dd>
  <dt>Clientes y oportunidades</dt><dd>${p.clientes.length} (${p.clientes.filter(c=>c.stage==="ganado").length} clientes)</dd><dt>Canales</dt><dd>${p.canales.length}</dd>
  <dt>Pruebas y garantías</dt><dd>${p.pruebas.length} pruebas · ${p.antirriesgo.length} garantías</dd><dt>Mercados objetivo</dt><dd>${esc(p.expansion.mercados||"—")}</dd></dl></div>
  <div class="card"><b>Código de respuestas</b><p class="help" style="margin:0">Contiene todas sus respuestas. Cópielo completo y péguelo en un correo a su asesor.</p>
  <div class="code" id="code">${esc(encode(p))}</div>
  <div class="row" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="copy">Copiar código</button><button class="btn" id="dl" hidden>Descargar archivo</button></div>
  ${sent?`<div class="ok">Código copiado. Péguelo en un correo a su asesor de ABC Advisory Bridge Club.</div>`:""}</div>
  <div class="card"><b>¿Quiere empezar de cero?</b><p class="help" style="margin:0">Borra las respuestas guardadas en este navegador.</p><div><button class="btn ghost" id="reset">${window._conf?"Pulse otra vez para borrar":"Borrar respuestas"}</button></div></div>`}

/* ---- Render ---- */
function render(){
  $("#steps").innerHTML=SECTIONS.map((s,i)=>`<button data-go="${i}" ${i===step?'aria-current="step"':""} class="${i<step?"done":""}"><span class="k">${i<step?"✓":i}</span><span>${s.t}</span></button>`).join("");
  $("#prog").innerHTML=`<span>Sección ${step} de ${SECTIONS.length-1} · ${SECTIONS[step].t}</span><div class="bar"><i style="width:${step/(SECTIONS.length-1)*100}%"></i></div>`;
  $("#sec").innerHTML=SECTIONS[step].r();
  $("#prev").hidden=step===0;$("#next").hidden=step===SECTIONS.length-1;$("#next").textContent=step===0?"Empezar":step===SECTIONS.length-2?"Revisar":"Siguiente";
  if(step===SECTIONS.length-1)initDl();}
let dlApi=null;async function initDl(){try{dlApi=dlApi||await window.claude?.use?.("downloads")}catch(e){}if(dlApi&&$("#dl"))$("#dl").hidden=false}
function go(i){step=Math.max(0,Math.min(SECTIONS.length-1,i));window._conf=false;render();window.scrollTo(0,0)}
document.addEventListener("input",e=>{const p=e.target.dataset.p;if(!p)return;const v=e.target.type==="number"?(e.target.value===""?null:+e.target.value):e.target.value;set(p,v);
  if(p.startsWith("clientes.")&&p.endsWith(".company")){const h=e.target.closest(".item")?.querySelector(".ih b");if(h)h.textContent=e.target.value||"Cliente u oportunidad"}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.p&&t.tagName==="SELECT"){set(d.p,t.value);if(d.p.endsWith(".stage"))render();return}
  if(d.ck){const [p,i]=d.ck.split("|");const arr=new Set(get(p)||[]);t.checked?arr.add(+i):arr.delete(+i);set(p,[...arr].sort((a,b)=>a-b));return}
  if(d.bool){set(d.bool,t.checked);return}
  if(d.nicho){Q.nicho=+d.nicho;save();return}
  if(d.role){const [i,r]=d.role.split("|");const c=Q.clientes[+i];const s=new Set(c.roles||[]);t.checked?s.add(r):s.delete(r);c.roles=[...s];save();return}});
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go){go(+d.go);return}
  if(t.id==="invapply"){try{invApply(await invDecode($("#invcode").value));render();toast("Cuestionario preparado para "+(Q.inv.empresa||"su empresa"))}catch(err){toast("Ese código no es válido. Compruebe que lo ha copiado entero.")}return}
  if(t.id==="next"){go(step+1);return}if(t.id==="prev"){go(step-1);return}
  if(d.sc){const [p,n]=d.sc.split("|");set(p,+n);t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t));return}
  if(d.add){Q[d.add].push(d.add==="clientes"?{roles:[]}:{});save();render();const items=document.querySelectorAll("#sec input[data-p]");items[items.length-1]?.scrollIntoView({block:"center"});return}
  if(d.rm){const [p,i]=d.rm.split("|");Q[p].splice(+i,1);if(p==="segmentos"){if(!Q.segmentos.length)Q.segmentos.push({});if(Q.nicho>=Q.segmentos.length)Q.nicho=0}save();render();return}
  if(t.id==="copy"){const txt=$("#code").textContent;try{await navigator.clipboard.writeText(txt);sent=true;render();toast("Código copiado")}catch(err){const r=document.createRange();r.selectNodeContents($("#code"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Código seleccionado: cópielo con Ctrl+C o Cmd+C")}return}
  if(t.id==="dl"&&dlApi){try{const r=await dlApi.save({filename:`cuestionario-abc-${(Q.empresa.nombre||"empresa").toLowerCase().replace(/[^a-z0-9]+/g,"-")}.txt`,data:$("#code").textContent});if(r==="saved")toast("Archivo descargado: adjúntelo en un correo a su asesor")}catch(err){toast("No se pudo descargar. Use «Copiar código».")}return}
  if(t.id==="reset"){if(!window._conf){window._conf=true;t.textContent="Pulse otra vez para borrar";return}Q=blank();try{localStorage.removeItem(KEY)}catch(e){}window._conf=false;go(0);toast("Respuestas borradas")}});
render();
</script>
</body></html>
